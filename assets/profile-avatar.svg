<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="face-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Glow Circle -->
  <circle cx="150" cy="150" r="142" fill="url(#avatar-bg)" filter="url(#shadow)"/>
  <circle cx="150" cy="150" r="136" fill="#0f172a"/>
  
  <!-- Modern Tech Developer Silhouette / Geometric Initials Graphic -->
  <!-- Code Brackets Background -->
  <path d="M 95 105 L 65 140 L 95 175" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M 205 105 L 235 140 L 205 175" fill="none" stroke="#a855f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <line x1="160" y1="95" x2="140" y2="185" stroke="#6366f1" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Developer Head and Torso Vector -->
  <!-- Torso / Hoodie -->
  <path d="M 85 240 C 90 200, 120 185, 150 185 C 180 185, 210 200, 215 240 C 200 255, 175 262, 150 262 C 125 262, 100 255, 85 240 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 130 188 L 150 215 L 170 188" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Head -->
  <ellipse cx="150" cy="138" rx="34" ry="42" fill="#fed7aa"/>
  
  <!-- Hair (Modern side swept) -->
  <path d="M 116 130 C 114 100, 130 85, 155 85 C 180 85, 188 100, 186 122 C 178 110, 160 106, 142 108 C 128 110, 120 120, 116 130 Z" fill="#1e1b4b"/>
  
  <!-- Glasses / Developer specs -->
  <rect x="126" y="128" width="18" height="13" rx="3" fill="none" stroke="#0284c7" stroke-width="2.5"/>
  <rect x="156" y="128" width="18" height="13" rx="3" fill="none" stroke="#0284c7" stroke-width="2.5"/>
  <line x1="144" y1="133" x2="156" y2="133" stroke="#0284c7" stroke-width="2.5"/>
  <line x1="120" y1="132" x2="126" y2="132" stroke="#0284c7" stroke-width="2"/>
  <line x1="174" y1="132" x2="180" y2="132" stroke="#0284c7" stroke-width="2"/>
  <circle cx="135" cy="134" r="2.5" fill="#0f172a"/>
  <circle cx="165" cy="134" r="2.5" fill="#0f172a"/>

  <!-- Smile -->
  <path d="M 143 160 Q 150 166 157 160" fill="none" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>

  <!-- Badge Pill at bottom -->
  <rect x="95" y="235" width="110" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="150" y="252" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">JAY PARMAR</text>
  
  <!-- Status online pulse -->
  <circle cx="215" cy="85" r="9" fill="#10b981"/>
  <circle cx="215" cy="85" r="14" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
</svg>